{% extends 'base.html' %}

{% block title %}Edit Transaksi{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-warning">
                <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Edit Transaksi</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Tanggal</label>
                        <input type="date" name="tanggal" class="form-control" 
                               value="{{ transaksi.tanggal.strftime('%Y-%m-%d') }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Keterangan</label>
                        <input type="text" name="keterangan" class="form-control" 
                               value="{{ transaksi.keterangan }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kategori</label>
                        <select name="kategori" class="form-select" required>
                            {% for kat in ['Makanan','Transportasi','Belanja','Gaji','Bonus','Tagihan','Hiburan','Lainnya'] %}
                                <option value="{{ kat }}" 
                                    {% if transaksi.kategori == kat %}selected{% endif %}>
                                    {{ kat }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Jenis Transaksi</label>
                        <select name="jenis" class="form-select" required>
                            <option value="masuk" {% if transaksi.jenis == 'masuk' %}selected{% endif %}>
                                Pemasukan
                            </option>
                            <option value="keluar" {% if transaksi.jenis == 'keluar' %}selected{% endif %}>
                                Pengeluaran
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Jumlah (Rp)</label>
                        <input type="number" name="jumlah" class="form-control" 
                               value="{{ transaksi.jumlah }}" min="1" step="any" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-save"></i> Update
                        </button>
                        <a href="/" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Kembali
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
